<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>David Cordero</title>

    <meta name="description" content="Official website of David Cordero, composer and sound artist.">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="site-header">

        <div class="header-container">

            <nav class="main-nav" aria-label="Primary navigation">

                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#releases">Selected Releases</a>
                <a href="#scoring">Scoring</a>
                <a href="#performances">Performances</a>
                <a href="#noray">Noray Records</a>
                <a href="#contact">Contact</a>

            </nav>

        </div>

    </header>

    <main>

        <!-- ==================================================
             HOME
        =================================================== -->

        <section id="home" class="panel hero">

            <div class="hero-content">

                <img
                    class="hero-image"
                    src="images/paula-bonet.jpg"
                    alt="Artwork by Paula Bonet">

                <h1>David Cordero</h1>

                <p class="hero-subtitle">
                    Composer · Sound Artist
                </p>

            </div>

        </section>

        <!-- ==================================================
             ABOUT
        =================================================== -->

        <section id="about" class="panel">

            <div class="content">

                <h2>About</h2>

            </div>

        </section>

        <!-- ==================================================
             SELECTED RELEASES
        =================================================== -->

        <section id="releases" class="panel">

            <div class="content">

                <h2>Selected Releases</h2>

            </div>

        </section>

        <!-- ==================================================
             SCORING
        =================================================== -->

        <section id="scoring" class="panel">

            <div class="content">

                <h2>Scoring</h2>

            </div>

        </section>

        <!-- ==================================================
             PERFORMANCES
        =================================================== -->

        <section id="performances" class="panel">

            <div class="content">

                <h2>Performances</h2>

            </div>

        </section>

        <!-- ==================================================
             NORAY RECORDS
        =================================================== -->

        <section id="noray" class="panel">

            <div class="content">

                <h2>Noray Records</h2>

            </div>

        </section>

        <!-- ==================================================
             CONTACT
        =================================================== -->

        <section id="contact" class="panel">

            <div class="content">

                <h2>Contact</h2>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</html>
